<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gamer sign in</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">

    
    <section class="intro">
    
        <img class="logo" src="images/logo.svg" alt="Neoncore">

    
        <h1 class="title">
    
            <span class="slashes">//</span>
    
            <span>JOIN THE<br>NEXUS</span>
    
        </h1>

      <p class="tagline">INITIALIZE YOUR NEONCORE IDENTITY</p>

      <div class="divider"></div>

    
      <div class="status-heading">
    
        <span>OPERATOR ID</span>
    
        <span>0/5 READY</span>
    
    
      </div>

      <h2 class="unassigned">UNASSIGNED</h2>

      
      <div class="status-row">
      
        <span>CALLSIGN</span><span class="rule"></span><span>PENDING</span>
      
    
    </div>
    
    
    <div class="status-row">
    
    
        <span>EMAIL</span><span class="rule"></span><span>PENDING</span>
    
    
    </div>
    
    <div class="status-row">
    
    
        <span>PASSWORD</span><span class="rule"></span><span>PENDING</span>
    
    
    </div>
    
    
    <div class="status-row">
    
     <span>CONFIRM</span><span class="rule"></span><span>PENDING</span>
      
    
    </div>
    
    <div class="status-row">
    
        <span>TERMS</span><span class="rule"></span><span>REQUIRED</span>
    
    
    </div>
    

  </section>

    <section class="form-panel">
  
        <div class="form-heading">
  
            <span>NEW OPERATOR</span>
  
            <span>ALL FIELDS REQUIRED</span>
  
        </div>

      <form>
       
        <label for="callsign">CALLSIGN</label>
       
        <input id="callsign" name="callsign" type="text" placeholder="E.g. Vortex_07">

       
        <label for="email">EMAIL</label>
       
        <input id="email" name="email" type="email" placeholder="you@example.com">

       
        <label for="password">PASSWORD</label>
       
        <input id="password" name="password" type="password">

       
        <label for="confirm">CONFIRM PASSWORD</label>
       
        <input id="confirm" name="confirm" type="password">

       
        <label class="terms">
       
            <input type="checkbox" name="terms">
       
            <span>I accept the <a href="#">Terms</a> and <a href="#">Privacy Policy</a></span>
       
       
        </label>

        <button type="submit">INITIALIZE ACCOUNT</button>

       
        <p class="login-prompt">Already an operator? <a href="#">Log in</a></p>
      
    </form>

    
   </section>
  

</main>

</body>

</html>
